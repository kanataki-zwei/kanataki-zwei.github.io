<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patrick Gichini — Data Control Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #060d1a;
      --surface: #0d1b2e;
      --surface-2: #112240;
      --border: #1e3a5f;
      --cyan: #00d4ff;
      --green: #00ff88;
      --amber: #ffb300;
      --red: #ff4466;
      --text: #ccd6f6;
      --muted: #8892b0;
      --font: 'JetBrains Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ── Back link ── */
    #back-link {
      position: fixed;
      top: 18px;
      left: 20px;
      z-index: 400;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      transition: color 0.2s;
    }
    #back-link:hover { color: var(--cyan); }

    /* ── Hint ── */
    #hint {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      animation: pulse-hint 3s ease-in-out infinite;
      z-index: 400;
      pointer-events: none;
    }
    @keyframes pulse-hint {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    /* ── Scene SVG ── */
    #scene {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* ── Interactive SVG elements ── */
    .interactive { cursor: pointer; }
    .glow-target { transition: filter 0.35s ease; }
    .interactive:hover .glow-target {
      filter: drop-shadow(0 0 14px rgba(0, 212, 255, 0.75));
    }
    .label-text {
      fill: #2a4a7f;
      transition: fill 0.2s;
    }
    .interactive:hover .label-text { fill: var(--cyan) !important; }
    .label-sub {
      fill: #1e3a5f;
      transition: fill 0.2s;
    }
    .interactive:hover .label-sub { fill: #4a7ba7 !important; }

    /* ── LED animations ── */
    @keyframes b1 { 0%,100%{opacity:1} 50%{opacity:0.15} }
    @keyframes b2 { 0%,40%{opacity:0.2} 70%,100%{opacity:1} }
    @keyframes b3 { 0%,65%{opacity:1} 80%{opacity:0.1} 100%{opacity:1} }
    .led-g { fill: var(--green); animation: b1 1.4s ease-in-out infinite; }
    .led-a { fill: var(--amber); animation: b2 2.1s ease-in-out infinite; }
    .led-r { fill: var(--red);   animation: b3 3.2s ease-in-out infinite; }
    .led-c { fill: var(--cyan);  animation: b1 1.9s ease-in-out infinite; }

    /* ── Idle pulse on interactive zones ── */
    @keyframes idle-pulse { 0%,100%{opacity:0.5} 50%{opacity:0.9} }
    .idle-glow { animation: idle-pulse 3.5s ease-in-out infinite; }

    /* ── Blinking cursor ── */
    @keyframes cursor-blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .cursor { animation: cursor-blink 1s step-end infinite; }

    /* ── Panel ── */
    #panel {
      position: fixed;
      top: 0;
      right: -500px;
      width: 460px;
      height: 100vh;
      background: rgba(6, 13, 26, 0.96);
      backdrop-filter: blur(24px);
      border-left: 1px solid var(--border);
      z-index: 500;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
      padding: 52px 32px 48px;
    }
    #panel.open { right: 0; }

    #panel-close {
      position: absolute;
      top: 16px;
      right: 18px;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      width: 30px;
      height: 30px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
      transition: color 0.2s, border-color 0.2s;
    }
    #panel-close:hover { color: var(--cyan); border-color: var(--cyan); }

    /* ── Panel content typography ── */
    #panel-content { font-family: var(--font); font-size: 0.78rem; line-height: 1.75; }

    #panel-content .ptag {
      display: block;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      color: var(--cyan);
      margin-bottom: 10px;
    }
    #panel-content h2 { font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 3px; line-height: 1.3; }
    #panel-content h3 { font-size: 0.8rem; color: var(--cyan); font-weight: 500; margin-bottom: 18px; }
    #panel-content hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
    #panel-content p { color: var(--muted); margin-bottom: 14px; font-size: 0.75rem; line-height: 1.8; }

    .stats-row { display: flex; flex-wrap: wrap; gap: 7px; margin: 18px 0; }
    .stat-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 3px 9px;
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    .role { margin-bottom: 22px; }
    .role-title { color: #fff; font-size: 0.8rem; font-weight: 700; }
    .role-company { color: var(--cyan); font-size: 0.74rem; }
    .role-period { color: var(--muted); font-size: 0.68rem; margin-bottom: 7px; }
    .role ul { padding-left: 14px; color: var(--muted); font-size: 0.72rem; }
    .role li { margin-bottom: 5px; }

    .skill-group { margin-bottom: 14px; }
    .skill-group-title { color: var(--green); font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 7px; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 3px 8px;
      font-size: 0.65rem;
      color: var(--text);
    }

    .pcard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .pcard-title { color: #fff; font-size: 0.8rem; font-weight: 700; margin-bottom: 3px; }
    .pcard-meta { color: var(--cyan); font-size: 0.65rem; margin-bottom: 8px; }
    .pcard-desc { color: var(--muted); font-size: 0.72rem; line-height: 1.75; margin-bottom: 9px; }
    .ptags { display: flex; flex-wrap: wrap; gap: 4px; }
    .ptag-chip {
      background: rgba(0,212,255,0.07);
      border: 1px solid rgba(0,212,255,0.18);
      border-radius: 3px;
      padding: 2px 7px;
      font-size: 0.62rem;
      color: var(--cyan);
    }

    .clink {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      text-decoration: none;
      color: var(--text);
      font-size: 0.76rem;
      margin-bottom: 9px;
      transition: border-color 0.2s, color 0.2s;
    }
    .clink:hover { border-color: var(--cyan); color: var(--cyan); }

    /* ── Overlay ── */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      z-index: 490;
      display: none;
    }
    #overlay.show { display: block; }

    /* ── Mobile message ── */
    #mobile-msg {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      gap: 20px;
    }
    #mobile-msg p { color: var(--muted); font-size: 0.85rem; line-height: 1.8; }
    #mobile-msg a {
      display: inline-block;
      border: 1px solid var(--border);
      color: var(--cyan);
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 0.78rem;
      text-decoration: none;
      transition: border-color 0.2s;
    }
    #mobile-msg a:hover { border-color: var(--cyan); }
    @media (max-width: 860px) {
      #mobile-msg { display: flex; }
    }
    @media (max-width: 860px) {
      #panel { width: 100%; right: -100%; }
    }

    /* ═══════════════════════════════════════════
       INTRO SEQUENCE
    ═══════════════════════════════════════════ */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 2000;
      overflow: hidden;
      transition: opacity 0.9s ease;
    }
    #intro.fade-out { opacity: 0; pointer-events: none; }

    #ctrl-room {
      position: fixed;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    #ctrl-room.reveal { opacity: 1; pointer-events: all; }

    /* Savannah SVG */
    #sv-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transition: opacity 0.9s ease;
    }

    /* Skip button */
    #skip-btn {
      position: absolute;
      top: 18px;
      right: 20px;
      z-index: 2100;
      background: rgba(13,27,46,0.85);
      border: 1px solid #1e3a5f;
      color: #8892b0;
      font-family: var(--font);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: 4px;
      transition: color 0.2s, border-color 0.2s;
    }
    #skip-btn:hover { color: #00d4ff; border-color: #00d4ff; }

    /* Running boy */
    #boy-runner {
      position: absolute;
      bottom: 32%;
      left: -5%;
      pointer-events: none;
      animation: boy-run 4s linear forwards;
    }
    #boy-runner svg { display: block; animation: boy-bob 0.26s ease-in-out infinite alternate; }
    @keyframes boy-run { from { left: -5%; } to { left: 44%; } }
    @keyframes boy-bob { from { transform: translateY(0); } to { transform: translateY(-9px); } }
    #boy-runner.entering {
      animation: boy-enter 0.9s linear forwards !important;
    }
    @keyframes boy-enter { from { left: 44%; opacity: 1; } to { left: 51%; opacity: 0; } }

    /* Door */
    #door-wrap {
      position: absolute;
      left: 50%;
      bottom: 32%;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }
    #door-wrap.show { opacity: 1; }

    .door-frame {
      width: 128px;
      height: 210px;
      background: #060d1a;
      border: 5px solid #7a4820;
      border-radius: 64px 64px 0 0;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0,212,255,0.14), 0 10px 50px rgba(0,0,0,0.7);
    }
    .door-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 65%, rgba(0,212,255,0.15), transparent 68%);
      border-radius: inherit;
    }
    .door-panel {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #7a4520, #5c2e10);
      border-radius: 59px 59px 0 0;
      transform-origin: 0% 50%;
      transition: transform 1.1s cubic-bezier(0.4,0,0.2,1);
    }
    .door-panel::before {
      content: '';
      position: absolute;
      inset: 14px 12px 14px 12px;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 46px 46px 2px 2px;
    }
    .door-panel.open { transform: perspective(360px) rotateY(-84deg); }
    .door-handle {
      position: absolute;
      right: 18px;
      top: 50%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #c8901a;
      box-shadow: 0 0 7px rgba(200,144,26,0.75);
    }

    /* Room scene */
    #room-scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.9s ease;
      pointer-events: none;
    }
    #room-scene.show { opacity: 1; }
    #room-svg { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* Cursor */
    #room-cursor {
      position: absolute;
      left: 36%;
      top: 44%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10;
    }
    #room-cursor.show { opacity: 1; }
    #room-cursor.move { animation: cursor-move 1.3s cubic-bezier(0.4,0,0.2,1) forwards; }
    @keyframes cursor-move { to { left: 49.5%; top: 36%; } }

    /* Click ripple */
    #click-ripple {
      position: absolute;
      left: 50%;
      top: 36%;
      transform: translate(-50%, -50%);
      width: 0; height: 0;
      border-radius: 50%;
      background: rgba(0,212,255,0.5);
      pointer-events: none;
    }
    #click-ripple.fire { animation: ripple 0.7s ease-out forwards; }
    @keyframes ripple {
      0%   { width: 0; height: 0; opacity: 0.9; }
      100% { width: 320px; height: 320px; margin: -160px; opacity: 0; }
    }

    /* Flash */
    #intro-flash {
      position: absolute;
      inset: 0;
      background: rgba(0,212,255,0.25);
      opacity: 0;
      pointer-events: none;
    }
    #intro-flash.fire { animation: flash-out 0.55s ease-out forwards; }
    @keyframes flash-out { 0% { opacity: 1; } 100% { opacity: 0; } }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════
     INTRO SEQUENCE
════════════════════════════════════════════════════ -->
<div id="intro">
  <button id="skip-btn">SKIP →</button>

  <!-- Savannah landscape SVG -->
  <svg id="sv-svg" viewBox="0 0 1400 780" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sv-sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#0d2244"/>
        <stop offset="28%"  stop-color="#8b3015"/>
        <stop offset="58%"  stop-color="#d96a14"/>
        <stop offset="80%"  stop-color="#f0921a"/>
        <stop offset="100%" stop-color="#f5b830"/>
      </linearGradient>
    </defs>

    <!-- Sky -->
    <rect width="1400" height="780" fill="url(#sv-sky)"/>

    <!-- Sun (at horizon, partially behind mountains) -->
    <circle cx="700" cy="494" r="130" fill="#ff6b00" opacity="0.12"/>
    <circle cx="700" cy="494" r="85"  fill="#ff8c00" opacity="0.22"/>
    <circle cx="700" cy="494" r="52"  fill="#ffa800" opacity="0.5"/>
    <circle cx="700" cy="494" r="36"  fill="#ffc800" opacity="0.88"/>

    <!-- Distant mountains silhouette -->
    <path d="M 0 455 C 80 415 160 438 240 398 C 310 364 390 388 465 355 C 538 325 622 348 700 338 C 780 328 862 352 940 342 C 1018 330 1102 358 1180 346 C 1258 332 1342 364 1400 350 L 1400 495 L 0 495 Z" fill="#20153a" opacity="0.95"/>

    <!-- Far ground layer -->
    <path d="M 0 780 L 0 475 Q 120 456 240 470 Q 380 450 520 464 Q 660 450 700 456 Q 820 448 980 462 Q 1120 450 1260 464 Q 1360 452 1400 460 L 1400 780 Z" fill="#7a4812"/>

    <!-- Mid ground layer -->
    <path d="M 0 780 L 0 500 Q 160 482 320 496 Q 480 480 640 494 Q 800 480 960 494 Q 1120 480 1280 496 Q 1360 486 1400 492 L 1400 780 Z" fill="#4a2c08"/>

    <!-- Near ground -->
    <path d="M 0 780 L 0 522 Q 180 505 360 518 Q 540 503 720 518 Q 900 503 1080 518 Q 1260 503 1400 516 L 1400 780 Z" fill="#2e1a06"/>

    <!-- Foreground grass (jagged) -->
    <path d="M 0 780 L 0 530 Q 25 512 50 530 Q 75 510 100 526 Q 125 506 150 522 Q 175 502 200 518 Q 225 498 250 514 Q 275 494 300 510 Q 325 490 350 506 Q 375 486 400 502 Q 425 482 450 498 Q 475 478 500 494 Q 525 474 550 490 Q 575 470 600 486 Q 625 466 650 482 Q 675 462 700 478 Q 725 458 750 474 Q 775 454 800 470 Q 825 450 850 466 Q 875 446 900 462 Q 925 442 950 458 Q 975 438 1000 454 Q 1025 434 1050 450 Q 1075 430 1100 446 Q 1125 426 1150 442 Q 1175 422 1200 438 Q 1225 418 1250 434 Q 1275 414 1300 430 Q 1325 410 1350 426 Q 1375 406 1400 422 L 1400 780 Z" fill="#1a2808"/>

    <!-- Acacia tree (right side) -->
    <g fill="#0a0603">
      <!-- Trunk -->
      <path d="M 1118 528 L 1113 462 L 1120 444 L 1127 462 L 1122 528 Z"/>
      <!-- Left branch -->
      <line x1="1115" y1="460" x2="1060" y2="444" stroke="#0a0603" stroke-width="6" stroke-linecap="round"/>
      <line x1="1060" y1="444" x2="1038" y2="435" stroke="#0a0603" stroke-width="4" stroke-linecap="round"/>
      <!-- Right branch -->
      <line x1="1125" y1="457" x2="1174" y2="441" stroke="#0a0603" stroke-width="6" stroke-linecap="round"/>
      <line x1="1174" y1="441" x2="1198" y2="433" stroke="#0a0603" stroke-width="4" stroke-linecap="round"/>
      <!-- Centre branch up -->
      <line x1="1120" y1="444" x2="1118" y2="414" stroke="#0a0603" stroke-width="5" stroke-linecap="round"/>
      <!-- Canopy (flat-topped organic shape) -->
      <path d="M 1030 440 C 1026 428 1038 416 1054 414 C 1058 406 1070 402 1082 406 C 1088 398 1100 396 1112 400 C 1116 392 1128 390 1136 396 C 1144 390 1158 394 1162 402 C 1174 402 1184 412 1180 422 C 1188 428 1184 440 1174 440 C 1170 448 1158 452 1148 448 C 1142 454 1128 454 1120 448 C 1112 454 1098 452 1092 446 C 1082 450 1068 448 1062 440 C 1052 440 1030 436 1030 440 Z"/>
      <!-- Canopy extra depth bumps -->
      <ellipse cx="1082" cy="426" rx="18" ry="10"/>
      <ellipse cx="1120" cy="416" rx="20" ry="10"/>
      <ellipse cx="1158" cy="423" rx="18" ry="10"/>
    </g>

    <!-- A second smaller acacia (far left for depth) -->
    <g fill="#120804" opacity="0.6">
      <path d="M 198 520 L 194 476 L 200 462 L 206 476 L 202 520 Z"/>
      <line x1="196" y1="474" x2="168" y2="464" stroke="#120804" stroke-width="4" stroke-linecap="round"/>
      <line x1="204" y1="472" x2="228" y2="463" stroke="#120804" stroke-width="4" stroke-linecap="round"/>
      <path d="M 158 468 C 155 460 164 454 174 452 C 178 446 188 444 196 448 C 200 442 210 442 216 448 C 222 442 234 446 236 452 C 244 454 248 462 244 468 C 248 474 242 480 234 478 C 230 484 220 484 214 480 C 208 484 198 482 194 476 C 186 476 158 472 158 468 Z"/>
    </g>

    <!-- Birds -->
    <g stroke="#0d1830" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M 280 132 C 285 128 290 132 295 128"/>
      <path d="M 318 120 C 324 116 330 120 336 116"/>
      <path d="M 302 150 C 307 146 312 150 317 146"/>
      <path d="M 462 103 C 470 98 478 103 486 98"/>
      <path d="M 500 120 C 507 116 514 120 521 116"/>
      <path d="M 192 160 C 198 156 204 160 210 156"/>
      <path d="M 165 144 C 170 140 175 144 180 140"/>
      <path d="M 840 88 C 847 84 854 88 861 84"/>
      <path d="M 870 105 C 876 101 882 105 888 101"/>
    </g>

    <!-- Warm haze at horizon -->
    <rect x="0" y="460" width="1400" height="40" fill="url(#sv-sky)" opacity="0.18"/>
  </svg>

  <!-- Running boy -->
  <div id="boy-runner">
    <svg viewBox="-22 -60 44 70" width="60" height="88">
      <g fill="#0a0603" stroke="#0a0603" stroke-linecap="round">
        <circle cx="2" cy="-48" r="10" stroke="none"/>
        <line x1="1" y1="-38" x2="-1" y2="-16" stroke-width="9"/>
        <line x1="0" y1="-30" x2="-14" y2="-38" stroke-width="5.5"/>
        <line x1="-14" y1="-38" x2="-18" y2="-30" stroke-width="5.5"/>
        <line x1="0" y1="-30" x2="14" y2="-22" stroke-width="5.5"/>
        <line x1="14" y1="-22" x2="18" y2="-14" stroke-width="5.5"/>
        <line x1="-1" y1="-16" x2="-16" y2="-2" stroke-width="6.5"/>
        <line x1="-16" y1="-2" x2="-20" y2="8" stroke-width="6.5"/>
        <line x1="-1" y1="-16" x2="12" y2="-2" stroke-width="6.5"/>
        <line x1="12" y1="-2" x2="10" y2="10" stroke-width="6.5"/>
        <ellipse cx="0" cy="12" rx="18" ry="4" opacity="0.3" stroke="none"/>
      </g>
    </svg>
  </div>

  <!-- Door standing in savannah -->
  <div id="door-wrap">
    <div class="door-frame">
      <div class="door-glow"></div>
      <div class="door-panel">
        <div class="door-handle"></div>
      </div>
    </div>
  </div>

  <!-- Room scene (fades in after door opens) -->
  <div id="room-scene">
    <svg id="room-svg" viewBox="0 0 1400 780" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="room-amb" cx="50%" cy="38%" r="30%">
          <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0.1"/>
          <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="scr-g" cx="50%" cy="50%" r="55%">
          <stop offset="0%"   stop-color="#003d5c"/>
          <stop offset="100%" stop-color="#020c1a"/>
        </radialGradient>
        <radialGradient id="mon-s" cx="50%" cy="46%" r="32%">
          <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0.09"/>
          <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Dark room -->
      <rect width="1400" height="780" fill="#040810"/>
      <rect x="0" y="0" width="1400" height="468" fill="#050e1a"/>
      <line x1="0" y1="468" x2="1400" y2="468" stroke="#0d1b2e" stroke-width="1.5" opacity="0.5"/>
      <rect width="1400" height="780" fill="url(#room-amb)"/>

      <!-- Monitor -->
      <rect x="554" y="146" width="292" height="192" rx="7" fill="#091422" stroke="#1e3a5f" stroke-width="2.5"/>
      <rect x="566" y="157" width="268" height="170" rx="3" fill="url(#scr-g)"/>

(function runIntro() {
  const intro      = document.getElementById('intro');
  const ctrlRoom   = document.getElementById('ctrl-room');

  const doorWrap   = document.getElementById('door-wrap');

  const cursor     = document.getElementById('room-cursor');
  const ripple     = document.getElementById('click-ripple');
  const flash      = document.getElementById('intro-flash');
  const skipBtn    = document.getElementById('skip-btn');

  function reveal() {
    intro.classList.add('fade-out');
    ctrlRoom.classList.add('reveal');
    setTimeout(() => { intro.style.display = 'none'; }, 1000);
  }

  skipBtn.addEventListener('click', reveal);

  // Boy reaches door — show door
  setTimeout(() => doorWrap.classList.add('show'), 3600);
  // Door swings open
  setTimeout(() => doorPanel.classList.add('open'), 4000);
  // Boy walks in and fades
  setTimeout(() => boyRunner.classList.add('entering'), 4800);

  // Transition: savannah fades, room fades in
  setTimeout(() => {
    svSvg.style.opacity = '0';
    doorWrap.style.opacity = '0';
    roomScene.classList.add('show');
  }, 5300);

  // Cursor appears
  setTimeout(() => cursor.classList.add('show'), 6600);
  // Cursor moves toward monitor
  setTimeout(() => cursor.classList.add('move'), 7200);
  // Click effect
  setTimeout(() => {
    ripple.classList.add('fire');
    flash.classList.add('fire');
  }, 8400);
  // Reveal control room
  setTimeout(reveal, 8900);
})();

  const d = new Date();
  const hh = String(d.getHours()).padStart(2,'0');

  const ss = String(d.getSeconds()).padStart(2,'0');
  document.getElementById('sys-clock').textContent = `${hh}:${mm}:${ss}`;
  setTimeout(tick, 1000);
})();

const panel     = document.getElementById('panel');
const overlay   = document.getElementById('overlay');
const content   = document.getElementById('panel-content');
const closeBtn  = document.getElementById('panel-close');

function open(section) {
  content.innerHTML = sections[section] || '';
  panel.classList.add('open');
  overlay.classList.add('show');
}
function close() {
  panel.classList.remove('open');
  overlay.classList.remove('show');
}

document.querySelectorAll('.interactive').forEach(el => {
  el.addEventListener('click', () => open(el.dataset.section));
});
closeBtn.addEventListener('click', close);
overlay.addEventListener('click', close);
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
</script>
